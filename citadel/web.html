<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UMI-T · 原子任务测试</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#10151c;color:#e7edf4}
body{max-width:1240px;margin:32px auto;padding:0 24px}h1{font-size:24px}h2{font-size:18px}
header,.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}
.muted{color:#a3afc0;font-size:14px}button,select{font:inherit;border:1px solid #384453;border-radius:8px;padding:10px;background:#1c2632;color:inherit}
button{cursor:pointer}button.primary{background:#2b5cd8}button:disabled{opacity:.5;cursor:wait}select{min-width:260px}
section{margin-top:22px;background:#18212b;padding:20px;border-radius:12px}
video{width:100%;background:#090d12;border-radius:8px;max-height:420px}.cameras{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cameras video{max-height:230px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #303c49}
th:nth-child(-n+2),td:nth-child(-n+2){white-space:nowrap}
.pass{color:#7de1aa}.fail{color:#ff9292}.unknown{color:#f0ce7b}.evidence{display:flex;gap:12px;overflow:auto}
.evidence figure{margin:0;min-width:280px;max-width:400px}.evidence img{width:100%;cursor:pointer;border-radius:6px}
[hidden]{display:none!important}@media(max-width:720px){.cameras{grid-template-columns:1fr}body{padding:0 14px}}
</style>
<header><h1>UMI-T · 原子任务测试</h1><span id="task" class="muted"></span></header>
<p class="muted">按误放、误拒筛选，对照 GT 与算法结论。三路完整视频可直接播放或下载；拼接视频按每 1 秒采样。</p>
<div class="toolbar">
<select id="filter" aria-label="筛选审核结果">
<option value="all">全部记录</option><option value="errors">全部错例</option>
<option value="false_accept">误放</option><option value="false_reject">误拒</option>
<option value="needs_review">待复核</option>
</select>
<select id="episode" aria-label="选择采集记录"></select>
<button id="prepare">准备视频</button>
<button id="review" class="primary">开始审核</button>
<a href="/docs" class="muted">API 文档</a>
</div>
<p id="notice" role="status" class="muted">正在加载记录…</p>
<section id="videos" hidden>
<h2>三路拼接（每 1 秒采样）</h2><video id="stitched" controls preload="metadata"></video>
<div class="cameras">
<div><p class="muted">主镜头完整视频 · <a id="download_main" class="muted" download>下载 MP4</a></p><video id="main" controls preload="metadata"></video></div>
<div><p class="muted">左腕完整视频 · <a id="download_left_wrist" class="muted" download>下载 MP4</a></p><video id="left_wrist" controls preload="metadata"></video></div>
<div><p class="muted">右腕完整视频 · <a id="download_right_wrist" class="muted" download>下载 MP4</a></p><video id="right_wrist" controls preload="metadata"></video></div>
</div></section>
<section id="signals" hidden><h2>夹爪与触觉时序</h2>
<p class="muted">点击曲线定位对应视频时间。触觉强度为测点力向量模长之和，用于比较受力变化。</p>
<canvas id="gripper" width="1200" height="370" style="width:100%;cursor:crosshair" aria-label="夹爪位置和指尖受力曲线"></canvas></section>
<section id="result" hidden>
<h2 id="conclusion"></h2><p id="reason"></p><p id="comparison" class="muted"></p>
<table><thead><tr><th>检查项</th><th>判定</th><th>证据时间 / 画质说明</th></tr></thead><tbody id="checks"></tbody></table>
<details id="main-audit" hidden><summary>主镜头逐帧可见性（模型判定，点击定位视频）</summary><div id="main-frames" class="toolbar"></div></details>
<h2>时序观察</h2><ol id="observations"></ol>
<h2>证据帧</h2><div id="evidence" class="evidence"></div>
</section>
<section><h2>评测进度</h2><p id="stats" class="muted">尚未统计</p></section>
<script>
const $=id=>document.getElementById(id);
const state={rows:[],splits:["development"],result:null,media:null};
const names={object_match:"物体一致",scene_match:"场景一致",main_visibility:"主镜头可见性",image_quality:"画面质量",action:"任务动作",retry_free:"无失败重试",completeness:"动作完整性",hold:"持续悬空"};
const labels={false_accept:"误放",false_reject:"误拒",correct:"通过",incorrect:"不通过",needs_review:"待复核",failed:"处理失败",not_run:"未审核",completed:"已审核",pass:"符合",fail:"不符合",unknown:"待确认"};
async function request(path,options={}){
  const response=await fetch(path,options);
  const data=await response.json();
  if(!response.ok)throw new Error(data.detail||"请求失败");
  return data;
}
function busy(value){for(const id of ["filter","episode","prepare","review"])$(id).disabled=value}
function showMedia(media){
  state.media=media;$("videos").hidden=false;showGripper(media);
  for(const name of ["stitched","main","left_wrist","right_wrist"]){
    const item=media.videos[name];$(name).hidden=!item;
    if(item)$(name).src=item.url;else $(name).removeAttribute("src");
    const link=$("download_"+name);
    if(link&&item){link.href=item.url;link.download=$("episode").value+"_"+name+".mp4"}
  }
}
function showGripper(media, cursor=null){
  const channels=media.gripper?.channels||{}, entries=Object.entries(channels).filter(([,c])=>c.samples.length);
  $("signals").hidden=!entries.length;if(!entries.length)return;
  const canvas=$("gripper"),ctx=canvas.getContext("2d"),left=70,right=1180;
  const end=Math.max(...entries.map(([,c])=>c.samples.at(-1)[0]));if(end<=0)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);ctx.font="14px sans-serif";
  const legend={left_position:["左夹爪","#7fb8ff"],right_position:["右夹爪","#ffbd71"],
    left_finger0:["左指0","#7fb8ff"],left_finger1:["左指1","#ba9bff"],
    right_finger0:["右指0","#ffbd71"],right_finger1:["右指1","#ed8ba6"]};
  for(const [row,isPosition] of [true,false].entries()){
    const series=entries.filter(([name])=>name.endsWith("_position")===isPosition),top=30+row*170,bottom=top+120;
    const values=series.flatMap(([,c])=>c.samples.map(p=>p[1]));
    const low=values.reduce((a,b)=>Math.min(a,b),0),high=values.reduce((a,b)=>Math.max(a,b),1);
    const x=t=>left+t/end*(right-left),y=v=>bottom-(v-low)/(high-low)*(bottom-top);
    ctx.fillStyle="#c6d1db";ctx.fillText(isPosition?"夹爪位置（原始值）":"触觉相对强度（未标定）",left,top-12);
    ctx.strokeStyle="#374653";ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,bottom);ctx.lineTo(right,bottom);ctx.stroke();
    ctx.fillText(high.toFixed(1),5,top+5);ctx.fillText(low.toFixed(1),5,bottom);
    series.forEach(([name,channel],i)=>{
      const [label,color]=legend[name];ctx.strokeStyle=color;ctx.beginPath();
      channel.samples.forEach(([t,v],j)=>j&&t-channel.samples[j-1][0]<=0.1?ctx.lineTo(x(t),y(v)):ctx.moveTo(x(t),y(v)));ctx.stroke();
      ctx.fillStyle=color;ctx.fillText(label,650+i*120,top-12);
    });
    for(let i=0;i<=5;i++){ctx.fillStyle="#9eafbf";ctx.fillText((end*i/5).toFixed(1)+"s",x(end*i/5)-10,bottom+20)}
    if(cursor!==null){ctx.strokeStyle="#83d8ab";ctx.beginPath();ctx.moveTo(x(cursor),top);ctx.lineTo(x(cursor),bottom);ctx.stroke()}
  }
  canvas.onclick=event=>{
    const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*canvas.width/rect.width;
    const time=Math.max(0,Math.min(end,(x-left)/(right-left)*end));
    for(const [name,item] of Object.entries(media.videos)){
      const video=$(name);if(video?.readyState)video.currentTime=Math.max(0,Math.min(video.duration,time-item.start_s));
    }
    showGripper(media,time);
  };
}
function showResult(result){
  state.result=result;$("result").hidden=false;
  $("conclusion").textContent=labels[result.label||result.status]||result.status;
  $("reason").textContent=result.reason||"";
  const row=state.rows.find(row=>row.episode_id===result.episode_id);
  if(row)Object.assign(row,{label:result.label,status:result.status});
  const kind=outcome(row||{});
  $("comparison").textContent=(labels[kind]?labels[kind]+" · ":"")+"GT："+(labels[result.evaluation?.gt]||"无标签")+
    (result.evaluation?.gt_reason?" · GT原因："+result.evaluation.gt_reason:"");
  $("comparison").className=kind==="false_accept"||kind==="false_reject"?"fail":"muted";
  $("review").textContent=result.status==="failed"?"重试失败任务":"查看已有结果";
  $("checks").replaceChildren();$("observations").replaceChildren();$("evidence").replaceChildren();
  const evidence=new Map((result.evidence||[]).map(frame=>[frame.frame_id,frame]));
  const cameraNames={main:"主镜头画质",left_wrist:"左腕画质",right_wrist:"右腕画质"};
  for(const [name,check] of Object.entries({...result.checks,...result.quality_by_camera,...(result.hold?{hold:result.hold}:{})})){
    const row=document.createElement("tr");
    for(const value of [cameraNames[name]||names[name]||name,labels[check.state],check.evidence_ids.map(id=>evidence.get(id)?.time_s.toFixed(2)+"s").join("、")+(check.description?" · "+check.description:"")]){
      const cell=document.createElement("td");cell.textContent=value;row.append(cell);
    }
    row.children[1].className=check.state;$("checks").append(row);
  }
  for(const item of result.observations||[]){
    const li=document.createElement("li");li.textContent=item.description;$("observations").append(li);
  }
  const visibility=result.main_visibility_by_frame||{};
  $("main-audit").hidden=!Object.keys(visibility).length;
  $("main-audit").open=Object.values(visibility).includes("absent");
  $("main-frames").replaceChildren();
  const states={visible:["可见","pass"],absent:["出画","fail"],uncertain:["待确认","unknown"],no_frame:["无有效帧","muted"]};
  for(const [id,status] of Object.entries(visibility)){
    const frame=evidence.get(id);if(!frame)continue;
    const button=document.createElement("button"),[label,color]=states[status];
    button.textContent=frame.time_s.toFixed(2)+"s "+label;button.className=color;
    button.dataset.frame=id;button.onclick=()=>$("frame-"+id)?.click();$("main-frames").append(button);
  }
  for(const frame of result.evidence||[]){
    const figure=document.createElement("figure"),img=document.createElement("img"),caption=document.createElement("figcaption");
    img.src="/assets/"+result.episode_id+"/"+frame.path.split("/").pop();
    img.id="frame-"+frame.frame_id;img.alt=frame.time_s.toFixed(2)+"秒三路证据帧";
    img.onclick=()=>{
      if(!state.media)return;
      for(const [name,item] of Object.entries(state.media.videos)){
        const video=$(name);if(!video?.readyState)continue;
        const time=name==="stitched"?frame.video_time_s:frame.time_s-item.start_s;
        video.currentTime=Math.max(0,Math.min(video.duration,time||0));
      }
      showGripper(state.media,frame.time_s);
    };
    caption.textContent=frame.time_s.toFixed(2)+" 秒";figure.append(img,caption);$("evidence").append(figure);
  }
}
async function stats(){
  const reports=await Promise.all(state.splits.map(split=>request("/report?split="+split)));
  const n=Object.fromEntries(["total","completed","needs_review","failed","not_run","false_accept","false_reject"]
    .map(key=>[key,reports.reduce((sum,report)=>sum+report.counts[key],0)]));
  $("stats").textContent="共 "+n.total+" 条 · 已判定 "+n.completed+" · 待复核 "+n.needs_review+" · 处理失败 "+n.failed+" · 未审核 "+n.not_run+" · 误放 "+n.false_accept+" · 误拒 "+n.false_reject;
}
async function selected(){
  state.result=null;state.media=null;$("result").hidden=true;$("videos").hidden=true;$("signals").hidden=true;$("review").textContent="开始审核";
  for(const video of document.querySelectorAll("video")){video.pause();video.removeAttribute("src");video.load()}
  const id=$("episode").value;
  if(!id){$("notice").textContent="当前没有符合筛选的记录。";return}
  const url=new URL(location.href);url.searchParams.set("filter",$("filter").value);url.searchParams.set("episode",id);
  history.replaceState(null,"",url);
  const [result,media]=await Promise.all([
    fetch("/results/"+id).then(r=>r.ok?r.json():null),
    fetch("/media/"+id).then(r=>r.ok?r.json():null)]);
  if($("episode").value!==id)return;
  if(media)showMedia(media);if(result)showResult(result);
  $("notice").textContent=media?"完整视频已加载，可直接播放；选择记录不会调用模型。":"可先准备视频查看，再开始审核。";
}
async function action(runReview){
  const id=$("episode").value;busy(true);$("notice").textContent=runReview?"正在审核完整时序…":"正在对齐三路视频…";
  try{
    if(runReview){
      const result=await request("/reviews",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({episode_id:id,retry_failed:state.result?.status==="failed"})});
      showResult(result);
    }else showMedia(await request("/media/"+id,{method:"POST"}));
    const response=await fetch("/media/"+id);if(response.ok)showMedia(await response.json());
    await stats();$("notice").textContent=runReview?"审核结束。":"视频已准备。";
  }catch(error){$("notice").textContent=error.message}
  finally{busy(false)}
}
function outcome(row){
  if(row.gt==="incorrect"&&row.label==="correct")return "false_accept";
  if(row.gt==="correct"&&row.label==="incorrect")return "false_reject";
  return row.status==="needs_review"?"needs_review":null;
}
function matches(row,filter){
  const kind=outcome(row);
  return filter==="all"||(filter==="errors"?kind==="false_accept"||kind==="false_reject":kind===filter);
}
async function filterRows(preferred=$("episode").value){
  $("episode").replaceChildren();
  for(const row of state.rows.filter(row=>matches(row,$("filter").value))){
    const option=document.createElement("option");option.value=row.episode_id;
    option.textContent=row.task_code+" · "+row.episode_id.slice(0,10)+" · "+
      (labels[outcome(row)]||labels[row.label||row.status])+" · "+(row.split==="holdout"?"留出集":"开发集");
    $("episode").append(option);
  }
  if([...$("episode").options].some(option=>option.value===preferred))$("episode").value=preferred;
  for(const id of ["episode","prepare","review"])$(id).disabled=!$("episode").options.length;
  await selected();
}
$("filter").onchange=()=>filterRows().catch(error=>$("notice").textContent=error.message);
$("episode").onchange=()=>selected().catch(error=>$("notice").textContent=error.message);
$("prepare").onclick=()=>action(false);$("review").onclick=()=>action(true);
(async()=>{
  const [rows,settings,holdout]=await Promise.all([request("/episodes"),request("/settings"),fetch("/episodes?split=holdout")]);
  state.rows=rows.map(row=>({...row,split:"development"}));
  if(holdout.ok){
    state.splits.push("holdout");state.rows.push(...(await holdout.json()).map(row=>({...row,split:"holdout"})));
  }else if(holdout.status!==409)throw new Error("留出集记录加载失败");
  $("task").textContent="任务类型："+Object.values(settings.profiles).map(p=>p.display_name||"原子任务").join("、");
  for(const option of $("filter").options)option.textContent+="（"+state.rows.filter(row=>matches(row,option.value)).length+"）";
  const params=new URLSearchParams(location.search);
  if([...$("filter").options].some(option=>option.value===params.get("filter")))$("filter").value=params.get("filter");
  await filterRows(params.get("episode"));await stats();
})().catch(error=>$("notice").textContent=error.message);
</script>
</html>
