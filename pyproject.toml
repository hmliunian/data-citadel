[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-citadel"
version = "1.0.0"
description = "Task-configured review of synchronized robot video"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "mcap>=1.2,<2", "flatbuffers>=24.3",
  "av>=13,<17", "Pillow>=10,<13"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
data-citadel = "citadel.__main__:main"

[tool.setuptools.packages.find]
include = ["citadel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
citadel = ["web.html"]
