<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Citadel · 本地复核</title>
<style>
  :root{font-family:system-ui,sans-serif;color:#1c2934;background:#f4f6f8;line-height:1.5}
  body{max-width:1500px;margin:auto;padding:28px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:26px}
  header{margin-bottom:22px}.muted{color:#647383;font-size:14px}label{display:grid;gap:5px}
  .toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}
  input,select,button{font:inherit;border:1px solid #c6d0da;border-radius:6px;padding:8px;background:white}
  input{width:min(360px,75vw)}button{cursor:pointer}button:hover{border-color:#14798c}
  .panel,details{background:white;border:1px solid #dbe1e7;border-radius:10px;padding:18px;margin:16px 0}
  .verdict{display:grid;grid-template-columns:85px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid #e7ecf0}
  .verdict strong{font-weight:650}.verdict span{overflow-wrap:anywhere}#reason{margin:14px 0 0}
  #notice{color:#9b4b12;white-space:pre-wrap}#instruction{white-space:pre-wrap}
  .cameras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .camera{min-width:0}.camera video{width:100%;background:#10202d;border-radius:7px;aspect-ratio:4/3}
  .frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-height:360px;overflow:auto;margin-top:8px}
  .frame{padding:3px;text-align:left;font-size:11px;overflow:hidden}.frame img{width:100%;display:block}
  .frame.evidence{outline:2px solid #128097;outline-offset:-2px;background:#eaf9fc}
  summary{cursor:pointer;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
  @media(max-width:900px){.cameras{grid-template-columns:1fr}.frames{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
<body>
<header><h1>Data Citadel · 本地复核</h1>
  <p class="muted">只读缓存页：展示已生成的批量审核结果，不发起模型调用。帧上的时间保留各路实际采集时间。</p>
</header>
<div class="toolbar">
  <label>样本 ID<input id="episode-id" list="episode-options" autocomplete="off" placeholder="选择或输入 episode_id"></label>
  <datalist id="episode-options"></datalist>
  <label>审核路线<select id="route"><option>A</option><option>B</option></select></label>
  <button id="load">查看缓存</button><button id="refresh">刷新列表</button>
</div>
<p id="notice" role="status"></p>
<section class="panel">
  <h2 id="task">选择一个样本</h2><p id="instruction"></p>
  <div class="verdict"><strong>GT</strong><span id="gt">—</span></div>
  <div class="verdict"><strong>Predict</strong><span id="predict">—</span></div>
  <p id="reason"></p><p id="status" class="muted"></p>
  <details><summary>模型分项、时间证据与来源</summary><pre id="details">暂无结果</pre></details>
</section>
<section class="panel"><h2>待测三路相机</h2><p class="muted">点击帧定位对应视频；蓝色边框为本次审核引用的证据。</p><div id="candidate" class="cameras"></div></section>
<section><h2>本次配置的专家</h2><div id="experts"></div></section>
<script>
  const byId = id => document.getElementById(id);
  const views = {main: '头部', left_wrist: '左腕', right_wrist: '右腕'};
  const labels = {correct: '正确（correct）', incorrect: '错误（incorrect）'};
  const statuses = {completed: '已完成', needs_review: '待复核', failed: '执行失败'};
  let results = [], selection = 0;
  const node = (tag, text, className) => {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
  };
  async function get(url) {
    const response = await fetch(url);
    const data = await response.json();
    if (!response.ok) throw Error(data.detail || `HTTP ${response.status}`);
    return data;
  }
  function mediaCards(media, target, evidence = []) {
    target.replaceChildren();
    const used = new Set(evidence.map(frame => frame.frame_id || frame.evidence_id?.replace(/^C-/, '')));
    for (const [view, name] of Object.entries(views)) {
      const card = node('div', undefined, 'camera');
      card.append(node('h3', name));
      const data = media.views[view];
      if (!data) {card.append(node('p', '未缓存此路相机', 'muted')); target.append(card); continue;}
      const video = node('video');
      video.controls = true; video.preload = 'metadata'; video.src = data.url;
      const frames = node('div', undefined, 'frames');
      for (const frame of media.frames.filter(frame => frame.view === view)) {
        const button = node('button', undefined, 'frame' + (used.has(frame.frame_id) ? ' evidence' : ''));
        const img = node('img');
        img.src = frame.url; img.loading = 'lazy'; img.alt = `${name} ${frame.time_s.toFixed(3)} 秒`;
        button.title = `${frame.frame_id} · 视频 ${frame.video_time_s.toFixed(3)} 秒`;
        button.append(img, node('span', `${frame.time_s.toFixed(3)} s`));
        button.addEventListener('click', () => {
          const seek = () => {video.currentTime = frame.video_time_s;};
          if (video.readyState) seek();
          else video.addEventListener('loadedmetadata', seek, {once: true});
          video.scrollIntoView({block: 'nearest', behavior: 'smooth'});
        });
        frames.append(button);
      }
      card.append(video, frames); target.append(card);
    }
  }
  function showResult(result, metadata) {
    const source = result || metadata || {};
    byId('task').textContent = `${source.task_code || ''} · ${byId('episode-id').value}`;
    byId('instruction').textContent = source.instruction || '';
    byId('gt').textContent = `${source.gt_status || '无有效 GT'} · ${labels[source.gt] || '未计分类'}`;
    if (source.gt_reason) byId('gt').append(node('span', `；${source.gt_reason}`));
    byId('predict').textContent = result ? labels[result.label] || `${statuses[result.status] || result.status} · 暂无预测标签` : '该路线暂无缓存结果';
    byId('reason').textContent = result?.reason || '';
    byId('status').textContent = result ? `路线 ${result.route} · ${result.split} · 执行状态：${statuses[result.status] || result.status}` : '';
    byId('details').textContent = result ? JSON.stringify({checks: result.checks, evidence: result.evidence,
      reference: result.reference, usage: result.usage}, null, 2) : '暂无结果';
  }
  async function loadSelection() {
    const current = ++selection;
    const episodeId = byId('episode-id').value.trim(), route = byId('route').value;
    byId('notice').textContent = ''; byId('candidate').replaceChildren(); byId('experts').replaceChildren();
    const result = results.find(row => row.episode_id === episodeId && row.route === route);
    showResult(result);
    if (!episodeId) return;
    try {
      const media = await get(`/api/episodes/${encodeURIComponent(episodeId)}`);
      if (current !== selection) return;
      showResult(result, media); mediaCards(media, byId('candidate'), result?.evidence || []);
      byId('notice').textContent = media.warnings.join('；');
      for (const [index, expertId] of media.expert_ids.entries()) {
        const details = node('details'), content = node('div', undefined, 'cameras');
        details.append(node('summary', `专家 ${index + 1} · ${expertId}`), content);
        details.addEventListener('toggle', async () => {
          if (!details.open || content.childNodes.length) return;
          content.append(node('p', '正在加载缓存…', 'muted'));
          try {mediaCards(await get(`/api/episodes/${encodeURIComponent(expertId)}`), content);}
          catch (error) {content.replaceChildren(node('p', error.message));}
        });
        byId('experts').append(details);
      }
    } catch (error) {if (current === selection) byId('notice').textContent = error.message;}
  }
  async function refresh() {
    try {
      results = await get('/api/results');
      const ids = [...new Set(results.map(row => row.episode_id))];
      byId('episode-options').replaceChildren(...ids.map(id => {const option = node('option'); option.value = id; return option;}));
      if (!byId('episode-id').value) byId('episode-id').value = ids[0] || '';
      await loadSelection();
      if (!ids.length) byId('notice').textContent = '尚无可浏览的审核结果。请先运行批量审核，再刷新列表。';
    } catch (error) {byId('notice').textContent = error.message;}
  }
  byId('load').addEventListener('click', loadSelection);
  byId('route').addEventListener('change', loadSelection);
  byId('episode-id').addEventListener('change', loadSelection);
  byId('refresh').addEventListener('click', refresh);
  refresh();
</script>
</body>
</html>
